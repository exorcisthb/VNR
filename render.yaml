services:
  - type: web
    name: dau-viet-mien-khoi
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: GAME_ALLOWED_ORIGINS
        value: "*"
